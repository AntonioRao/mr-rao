name: "Ha tolto qualcosa che non doveva"
description: "Il motore ha sostituito un dato che non era personale (falso positivo)"
title: "[falso positivo] "
labels: ["motore", "falso positivo"]
body:
  - type: markdown
    attributes:
      value: |
        Conta quanto il difetto opposto, e per una ragione precisa: uno
        strumento che cancella mezzo documento viene disattivato, e da quel
        momento non protegge più niente.

        **Non incollare dati personali reali**, nemmeno qui: questo
        repository è pubblico e ciò che ci finisce resta recuperabile anche
        dopo la cancellazione. Se il testo che ti è stato rovinato contiene
        dati veri accanto, riscrivilo con valori inventati.

  - type: checkboxes
    id: niente-dati-veri
    attributes:
      label: Conferma
      options:
        - label: "In questa segnalazione **non c'è nessun dato personale reale**."
          required: true

  - type: textarea
    id: testo
    attributes:
      label: Il testo in ingresso
      description: "Le righe intorno bastano. Il contesto conta: la stessa parola su una lettera e su un modulo viene decisa in modo opposto."
      render: text
    validations:
      required: true

  - type: textarea
    id: uscita
    attributes:
      label: Cosa è uscito
      render: text
    validations:
      required: true

  - type: textarea
    id: perche
    attributes:
      label: Perché quel dato non andava tolto
      description: "Che cos'era davvero — un numero di protocollo, un codice prodotto, un'etichetta di campo, un toponimo…"
    validations:
      required: true

  - type: input
    id: versione
    attributes:
      label: Versione
      placeholder: "1.19.1"
    validations:
      required: true

  - type: dropdown
    id: stile
    attributes:
      label: Il documento era prosa o modulo?
      description: "Non è una curiosità: su una lettera due parole maiuscole di cui una negli elenchi sono quasi sempre una persona, su un modulo sono quasi sempre l'etichetta di un campo. La stessa regola ha segno opposto, ed è misurato."
      options:
        - "Prosa (lettera, email, relazione)"
        - "Modulo (dichiarazione, prospetto, tabella)"
        - "Misto / non saprei"
    validations:
      required: true
