# Build macOS arm64 (.app in un .dmg), firma ad-hoc gratuita.
# Non richiede Apple Developer Program. Gatekeeper avvisa al primo avvio.
name: macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m compileall -q app.py config.py mr_rao
      - run: python scripts/check_import.py
      - run: python -m mr_rao.cli health
      - name: Test
        env:
          MR_RAO_TRAY: "0"
          MR_RAO_FINESTRA: "0"
          MR_RAO_OPEN_BROWSER: "0"
          MR_RAO_SCORCIATOIA: "0"
        run: python -m pytest tests -q

  build:
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write        # solo per allegare il .dmg alla release del tag
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: venv e dipendenze
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements-build.txt
      - name: Icona e pacchetto
        run: |
          chmod +x scripts/build_mac.sh
          ./scripts/build_mac.sh
      - name: Il pacchetto risponde in HTTP
        env:
          MR_RAO_TRAY: "0"
          MR_RAO_FINESTRA: "0"
          MR_RAO_OPEN_BROWSER: "0"
          MR_RAO_SCORCIATOIA: "0"
        run: venv/bin/python scripts/verify_build.py "dist/MrRao.app/Contents/MacOS/MrRao"
      # Stessa prova, ma dal file che si scarica: monta il .dmg e lancia
      # l'eseguibile dal disco. Se hdiutil o il bundle dentro si rompono,
      # il primo passo sopra resterebbe verde da solo.
      - name: Il .dmg montato risponde in HTTP
        env:
          MR_RAO_TRAY: "0"
          MR_RAO_FINESTRA: "0"
          MR_RAO_OPEN_BROWSER: "0"
          MR_RAO_SCORCIATOIA: "0"
        run: |
          chmod +x scripts/verify_dmg.sh
          ./scripts/verify_dmg.sh dist/MrRao-macos-arm64.dmg venv/bin/python
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/MrRao-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: MrRao-macos
          path: |
            dist/MrRao-macos-arm64.dmg
            dist/SHA256SUMS-macos.txt
          retention-days: 14
          if-no-files-found: error

      # L'artefatto Actions scade in 14 giorni e non e' raggiungibile da un
      # link pubblico: la landing punta a
      # /releases/latest/download/MrRao-macos-arm64.dmg, che senza questo
      # passo risponde 404 finche' qualcuno non allega il file a mano.
      # E' successo alla v1.24.0 -- il .dmg e' arrivato sulla release un
      # giorno dopo, da un'esecuzione lanciata a mano.
      #
      # Solo su tag: le esecuzioni a mano su un ramo non hanno una release
      # a cui allegare, e non devono cambiare quella esistente.
      - name: Allega il .dmg alla release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/MrRao-macos-arm64.dmg
          dist/SHA256SUMS-macos.txt
          --clobber
        env:
          GH_TOKEN: ${{ github.token }}
