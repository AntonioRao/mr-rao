name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows on purpose: Mr. Rao is a Windows-first desktop tool, and two of
    # its regression tests cover Windows-specific behaviour — SO_EXCLUSIVEADDRUSE
    # port detection, and Documents folders redirected into OneDrive.
    runs-on: windows-latest

    steps:
      # v4/v5 giravano su Node 20, che i runner ora forzano su Node 24 con un
      # avviso di deprecazione a ogni esecuzione. Un avviso permanente in cima
      # al log e' rumore che insegna a non leggere il log.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q app.py config.py mr_rao

      # compileall guarda la sintassi: dice che il file e' scritto in Python,
      # non che si carica. Un import circolare, un nome sparito dal modulo da
      # cui lo si prende, una riga a livello di modulo che solleva: passano
      # tutti il passo qui sopra e rompono l'applicazione all'avvio. E' gia'
      # successo di committarne uno rotto, ed e' il motivo per cui questo
      # passo sta *dopo* compileall e non al suo posto: quando entrambi
      # falliscono, l'errore di sintassi si legge per primo. (P2.7)
      - name: Import check
        run: python scripts/check_import.py

      - name: Dependency health
        run: python -m mr_rao.cli health

      - name: Tests
        run: python -m pytest tests -q

      # The licence file is generated from the versions installed on the
      # maintainer's machine, so --check would fail here for the wrong reason:
      # CI resolves different versions. It runs in the local quality gate.
